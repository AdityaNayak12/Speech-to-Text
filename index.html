<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech to Text Pad</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Speech to Text Pad</h1>
        <div id="status-text" class="status-text">
            🔴 Not Listening
        </div>
        <div class="app-wrapper">
            <div class="text-box-area">
                <textarea id="text-area" placeholder="Your speech will appear here"></textarea>

                <div class="controls">
                    <button id="start-btn">Start Listening</button>
                    <button id="stop-btn">Stop Listening</button>
                </div>

                <button id="save-btn">Save Note</button>
            </div>
            <div id="saved-notes">
                <h3>My Notes</h3>
                <ul id="notes-list"></ul>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
